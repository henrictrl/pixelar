<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixelar</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --gray: #e0e0e0;
            --border: 1px solid #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: monospace;
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER & LOGO */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-bottom: var(--border);
            flex-shrink: 0;
        }

        .logo {
            display: grid;
            grid-template-columns: 10px 10px;
            grid-template-rows: 10px 10px;
            gap: 0;
            margin-right: 15px;
            border: 1px solid #000;
        }

        .logo div {
            width: 10px;
            height: 10px;
            border: 1px solid #000;
            background: #fff;
        }

        .logo .black-square {
            background: #000;
            border: 1px solid gray; /* Borda cinza apenas no preto */
        }

        h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* LAYOUT PRINCIPAL */
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .main-container {
                flex-direction: row;
            }
        }

        /* CANVAS AREA (Travada no topo no mobile) */
        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            border-bottom: var(--border);
            overflow: hidden;
            position: relative;
            min-height: 40vh; /* Garante espaço visível no mobile */
        }

        @media (min-width: 768px) {
            .canvas-container {
                border-bottom: none;
                border-right: var(--border);
                min-height: auto;
            }
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* Desliga suavização nativa */
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            color: #fff;
            padding: 10px 20px;
            font-weight: bold;
            display: none;
        }

        /* CONTROLES AREA (Scrollável no mobile) */
        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
            padding-bottom: 50px;
        }

        @media (min-width: 768px) {
            .controls-container {
                flex: 0 0 350px;
            }
        }

        .control-group {
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--gray);
            padding-bottom: 15px;
        }

        .control-group:last-child {
            border-bottom: none;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 5px;
            accent-color: #000;
        }

        .val-display {
            float: right;
            font-weight: normal;
        }

        select, button, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: var(--border);
            background: #fff;
            color: #000;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: bold;
        }

        button:hover, select:hover, input[type="file"]:hover {
            background: #f0f0f0;
        }

        button.primary {
            background: #000;
            color: #fff;
        }

        button.primary:hover {
            background: #333;
        }

        /* CORES E PALETAS */
        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            border: var(--border);
            cursor: pointer;
            padding: 0;
            background: none;
            -webkit-appearance: none;
            border-radius: 0;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0;
        }

        .info-text {
            font-size: 0.7rem;
            color: #666;
            margin-top: 5px;
            display: block;
        }

        .history-controls {
            display: flex;
            gap: 10px;
        }
        
        .history-controls button {
            flex: 1;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <div></div>
            <div></div>
            <div></div>
            <div class="black-square"></div>
        </div>
        <h1>Pixelar</h1>
    </div>

    <div class="main-container">
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div id="loading" class="loading">PROCESSANDO...</div>
        </div>

        <div class="controls-container">
            
            <div class="control-group">
                <input type="file" id="imageUpload" accept="image/*">
                <div class="history-controls">
                    <button id="btnUndo">Desfazer (0)</button>
                    <button id="btnDownload" class="primary">Baixar Imagem</button>
                </div>
            </div>

            <div class="control-group">
                <label>Tamanho do Pixel <span id="valPixelSize" class="val-display">8</span></label>
                <input type="range" id="pixelSize" min="1" max="100" value="8">
                <span class="info-text">Tamanhos menores demoram mais para processar. Use com sabedoria.</span>
            </div>

            <div class="control-group">
                <label>Agrupar <span id="valGroup" class="val-display">0</span></label>
                <input type="range" id="groupSize" min="0" max="50" value="0">
            </div>

            <div class="control-group">
                <label>Cores / Bits</label>
                <select id="colorCount">
                    <option value="2">2 Cores (1-bit)</option>
                    <option value="4">4 Cores (2-bit)</option>
                    <option value="8">8 Cores (3-bit)</option>
                    <option value="16" selected>16 Cores (4-bit)</option>
                    <option value="32">32 Cores</option>
                    <option value="64">64 Cores</option>
                    <option value="128">128 Cores</option>
                    <option value="256">256 Cores (8-bit)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Textura</label>
                <select id="ditherMode">
                    <option value="none">Sólido</option>
                    <option value="bayer4">Xadrez Fino</option>
                    <option value="bayer8">Xadrez Largo</option>
                    <option value="h-lines">Linhas Horizontais</option>
                    <option value="v-lines">Linhas Verticais</option>
                    <option value="noise">Ruído</option>
                </select>
            </div>

            <div class="control-group">
                <label>Aleatório</label>
                <div class="btn-grid">
                    <button id="btnRandConfigs">Configs</button>
                    <button id="btnRandColors">Cores</button>
                </div>
                <button id="btnRandAll" class="primary">Aleatório Total</button>
            </div>

            <div class="control-group">
                <label>Escolha suas cores</label>
                <div class="color-picker-grid">
                    <input type="color" id="c1" value="#000000">
                    <input type="color" id="c2" value="#555555">
                    <input type="color" id="c3" value="#aaaaaa">
                    <input type="color" id="c4" value="#ffffff">
                </div>
                <button id="btnApplyColors">Aplicar Cores</button>
                <button id="btnOriginalColors">Cores Originais</button>
            </div>

            <div class="control-group">
                <label>Presets</label>
                <select id="presetHardware">
                    <option value="">Selecione...</option>
                    <option value="emnl">EMNL</option>
                    <option value="gameboy">GameBoy (Verde)</option>
                    <option value="cga">CGA (Rosa/Ciano)</option>
                    <option value="nokia">Nokia 3310</option>
                    <option value="mac">Macintosh Clássico</option>
                    <option value="zx">ZX Spectrum</option>
                    <option value="cctv">Câmera Segurança</option>
                    <option value="thermo">Termografia</option>
                </select>
                <button id="btnSavePreset">Salvar Preset</button>
                <button id="btnExportTxt">Exportar Info (.txt)</button>
            </div>

            <div class="control-group">
                <label>Ajustes de Imagem</label>
                
                <label>Exposição <span id="valExp" class="val-display">0</span></label>
                <input type="range" id="exposure" min="-50" max="50" value="0">

                <label>Brilho <span id="valBri" class="val-display">0</span></label>
                <input type="range" id="brightness" min="-50" max="50" value="0">

                <label>Sombras <span id="valSha" class="val-display">0</span></label>
                <input type="range" id="shadows" min="-50" max="50" value="0">

                <label>Saturação <span id="valSat" class="val-display">100%</span></label>
                <input type="range" id="saturation" min="0" max="200" value="100">
            </div>

        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        let originalImage = null;
        let isProcessing = false;
        let useOriginalColors = true;
        let processTimeout = null;
        
        // Histórico
        const maxHistory = 10;
        let history = [];

        // Matrizes de Bayer para Dithering
        const bayer4x4 = [
            [ 0,  8,  2, 10],
            [12,  4, 14,  6],
            [ 3, 11,  1,  9],
            [15,  7, 13,  5]
        ].map(row => row.map(v => (v / 16) - 0.5));

        const bayer8x8 = [
            [ 0, 32,  8, 40,  2, 34, 10, 42],
            [48, 16, 56, 24, 50, 18, 58, 26],
            [12, 44,  4, 36, 14, 46,  6, 38],
            [60, 28, 52, 20, 62, 30, 54, 22],
            [ 3, 35, 11, 43,  1, 33,  9, 41],
            [51, 19, 59, 27, 49, 17, 57, 25],
            [15, 47,  7, 39, 13, 45,  5, 37],
            [63, 31, 55, 23, 61, 29, 53, 21]
        ].map(row => row.map(v => (v / 64) - 0.5));

        // Listeners de UI
        const inputs = ['pixelSize', 'groupSize', 'exposure', 'brightness', 'shadows', 'saturation'];
        inputs.forEach(id => {
            const el = document.getElementById(id);
            const valEl = document.getElementById('val' + id.substring(0,3).charAt(0).toUpperCase() + id.substring(1,3));
            el.addEventListener('input', () => {
                if(valEl) valEl.innerText = id === 'saturation' ? el.value + '%' : el.value;
            });
            el.addEventListener('change', triggerProcess);
        });

        document.getElementById('colorCount').addEventListener('change', triggerProcess);
        document.getElementById('ditherMode').addEventListener('change', triggerProcess);

        // Upload de Imagem
        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    
                    // Sorteia tudo na entrada da foto, limitando agrupar a 0-5
                    randomizeAll(true); 
                    
                    saveState();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // Botões
        document.getElementById('btnApplyColors').addEventListener('click', () => { useOriginalColors = false; triggerProcess(); saveState(); });
        document.getElementById('btnOriginalColors').addEventListener('click', () => { useOriginalColors = true; triggerProcess(); saveState(); });
        
        document.getElementById('btnRandConfigs').addEventListener('click', () => { randomizeConfigs(); triggerProcess(); saveState(); });
        document.getElementById('btnRandColors').addEventListener('click', () => { randomizeColors(); useOriginalColors = false; triggerProcess(); saveState(); });
        document.getElementById('btnRandAll').addEventListener('click', () => { randomizeAll(false); saveState(); });

        document.getElementById('presetHardware').addEventListener('change', applyPreset);
        
        document.getElementById('btnUndo').addEventListener('click', undo);

        document.getElementById('btnDownload').addEventListener('click', function() {
            if (!originalImage) return;
            canvas.toBlob(function(blob) {
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `pixelar_${Date.now()}.png`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                }
            }, 'image/png');
        });

        document.getElementById('btnExportTxt').addEventListener('click', function() {
            if (!originalImage) return;
            
            const selDither = document.getElementById('ditherMode');
            const ditherName = selDither.options[selDither.selectedIndex].text;
            
            let info = `PIXELAR - Configurações da Arte\n\n`;
            info += `Tamanho do Pixel: ${document.getElementById('pixelSize').value}\n`;
            info += `Agrupar: ${document.getElementById('groupSize').value}\n`;
            info += `Quantidade de Cores: ${document.getElementById('colorCount').value}\n`;
            info += `Textura: ${ditherName}\n\n`;
            
            info += `Ajustes:\n`;
            info += `Exposição: ${document.getElementById('exposure').value}\n`;
            info += `Brilho: ${document.getElementById('brightness').value}\n`;
            info += `Sombras: ${document.getElementById('shadows').value}\n`;
            info += `Saturação: ${document.getElementById('saturation').value}%\n\n`;

            if (!useOriginalColors) {
                info += `Paleta Customizada (Hex):\n`;
                info += `Cor 1: ${document.getElementById('c1').value}\n`;
                info += `Cor 2: ${document.getElementById('c2').value}\n`;
                info += `Cor 3: ${document.getElementById('c3').value}\n`;
                info += `Cor 4: ${document.getElementById('c4').value}\n`;
            } else {
                info += `Paleta: Cores Originais da Imagem\n`;
            }

            const blob = new Blob([info], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `pixelar_configs_${Date.now()}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        function triggerProcess() {
            if (!originalImage) return;
            clearTimeout(processTimeout);
            document.getElementById('loading').style.display = 'block';
            
            // Usa timeout para o UI dar render no aviso de loading antes de travar o processo
            processTimeout = setTimeout(() => {
                processImage();
                document.getElementById('loading').style.display = 'none';
            }, 50);
        }

        // --- SISTEMA DE ESTADOS (UNDO) ---
        function saveState() {
            if(!originalImage) return;
            const state = {
                pixelSize: document.getElementById('pixelSize').value,
                groupSize: document.getElementById('groupSize').value,
                colorCount: document.getElementById('colorCount').value,
                ditherMode: document.getElementById('ditherMode').value,
                exposure: document.getElementById('exposure').value,
                brightness: document.getElementById('brightness').value,
                shadows: document.getElementById('shadows').value,
                saturation: document.getElementById('saturation').value,
                c1: document.getElementById('c1').value,
                c2: document.getElementById('c2').value,
                c3: document.getElementById('c3').value,
                c4: document.getElementById('c4').value,
                useOriginalColors: useOriginalColors
            };
            
            history.push(state);
            if(history.length > maxHistory) history.shift();
            updateUndoBtn();
        }

        function undo() {
            if(history.length <= 1) return;
            history.pop(); // tira o atual
            const state = history[history.length - 1]; // pega o anterior
            
            document.getElementById('pixelSize').value = state.pixelSize;
            document.getElementById('groupSize').value = state.groupSize;
            document.getElementById('colorCount').value = state.colorCount;
            document.getElementById('ditherMode').value = state.ditherMode;
            document.getElementById('exposure').value = state.exposure;
            document.getElementById('brightness').value = state.brightness;
            document.getElementById('shadows').value = state.shadows;
            document.getElementById('saturation').value = state.saturation;
            
            document.getElementById('c1').value = state.c1;
            document.getElementById('c2').value = state.c2;
            document.getElementById('c3').value = state.c3;
            document.getElementById('c4').value = state.c4;
            
            useOriginalColors = state.useOriginalColors;
            
            // Atualizar displays de texto
            inputs.forEach(id => {
                const el = document.getElementById(id);
                const valEl = document.getElementById('val' + id.substring(0,3).charAt(0).toUpperCase() + id.substring(1,3));
                if(valEl) valEl.innerText = id === 'saturation' ? el.value + '%' : el.value;
            });

            updateUndoBtn();
            triggerProcess();
        }

        function updateUndoBtn() {
            const btn = document.getElementById('btnUndo');
            btn.innerText = `Desfazer (${Math.max(0, history.length - 1)})`;
            btn.disabled = history.length <= 1;
        }

        // --- LÓGICAS ALEATÓRIAS ---
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function randomizeConfigs(isInitialLoad = false) {
            const pSize = document.getElementById('pixelSize');
            pSize.value = randomInt(4, 24);
            document.getElementById('valPix').innerText = pSize.value;

            // Agrupar: Apenas mexe se for carregamento inicial. Caso contrário, zera.
            const gSize = document.getElementById('groupSize');
            if(isInitialLoad) {
                gSize.value = randomInt(0, 5);
            } else {
                gSize.value = 0;
            }
            document.getElementById('valGro').innerText = gSize.value;

            const colorOpts = [2, 4, 8, 16, 32];
            document.getElementById('colorCount').value = colorOpts[randomInt(0, colorOpts.length - 1)];

            const ditherOpts = ['none', 'none', 'bayer4', 'bayer8', 'h-lines', 'noise'];
            document.getElementById('ditherMode').value = ditherOpts[randomInt(0, ditherOpts.length - 1)];
        }

        function randomizeColors() {
            // Gera 4 cores baseadas em matizes distantes para garantir altíssimo contraste, saturação forte
            const hueBase = randomInt(0, 360);
            
            document.getElementById('c1').value = hslToHex((hueBase) % 360, randomInt(80, 100), randomInt(10, 20)); // Escura
            document.getElementById('c2').value = hslToHex((hueBase + randomInt(60, 120)) % 360, randomInt(70, 100), randomInt(40, 50)); // Média
            document.getElementById('c3').value = hslToHex((hueBase + randomInt(180, 240)) % 360, randomInt(70, 100), randomInt(60, 75)); // Média Clara
            document.getElementById('c4').value = hslToHex((hueBase + randomInt(90, 270)) % 360, randomInt(50, 100), randomInt(85, 95)); // Clara
        }

        function randomizeAll(isInitialLoad = false) {
            randomizeConfigs(isInitialLoad);
            randomizeColors();
            useOriginalColors = false;
            triggerProcess();
        }

        // --- PRESETS ---
        function applyPreset() {
            const val = document.getElementById('presetHardware').value;
            if(!val) return;

            // Resetar ajustes de imagem
            ['exposure', 'brightness', 'shadows'].forEach(id => {
                document.getElementById(id).value = 0;
                document.getElementById('val' + id.substring(0,3).charAt(0).toUpperCase() + id.substring(1,3)).innerText = 0;
            });
            document.getElementById('saturation').value = 100;
            document.getElementById('valSat').innerText = '100%';

            useOriginalColors = false;
            document.getElementById('groupSize').value = 0;
            document.getElementById('valGro').innerText = 0;

            if (val === 'emnl') {
                document.getElementById('pixelSize').value = 23;
                document.getElementById('valPix').innerText = 23;
                document.getElementById('colorCount').value = 8;
                document.getElementById('ditherMode').value = 'none';
                
                document.getElementById('groupSize').value = 1;
                document.getElementById('valGro').innerText = 1;
                
                document.getElementById('exposure').value = 14;
                document.getElementById('valExp').innerText = 14;
                
                document.getElementById('shadows').value = -20;
                document.getElementById('valSha').innerText = -20;
                
                document.getElementById('saturation').value = 120;
                document.getElementById('valSat').innerText = '120%';
                
                useOriginalColors = true;
            } else if (val === 'gameboy') {
                setPal('#0f380f', '#306230', '#8bac0f', '#9bbc0f');
                document.getElementById('colorCount').value = 4;
                document.getElementById('ditherMode').value = 'bayer4';
            } else if (val === 'cga') {
                setPal('#000000', '#55ffff', '#ff55ff', '#ffffff');
                document.getElementById('colorCount').value = 4;
                document.getElementById('ditherMode').value = 'bayer8';
            } else if (val === 'nokia') {
                setPal('#43523d', '#43523d', '#c7f0d8', '#c7f0d8');
                document.getElementById('colorCount').value = 2;
                document.getElementById('ditherMode').value = 'none';
            } else if (val === 'mac') {
                setPal('#000000', '#000000', '#ffffff', '#ffffff');
                document.getElementById('colorCount').value = 2;
                document.getElementById('ditherMode').value = 'bayer4';
            } else if (val === 'zx') {
                setPal('#000000', '#d70000', '#00d7d7', '#d7d7d7');
                document.getElementById('colorCount').value = 8;
                document.getElementById('ditherMode').value = 'noise';
                document.getElementById('saturation').value = 150;
            } else if (val === 'cctv') {
                setPal('#001100', '#224422', '#55aa55', '#aaffaa');
                document.getElementById('colorCount').value = 16;
                document.getElementById('ditherMode').value = 'h-lines';
            } else if (val === 'thermo') {
                setPal('#000033', '#cc0000', '#ffff00', '#ffffff');
                document.getElementById('colorCount').value = 32;
                document.getElementById('ditherMode').value = 'none';
                document.getElementById('groupSize').value = 5;
            }

            triggerProcess();
            saveState();
        }

        function setPal(c1, c2, c3, c4) {
            document.getElementById('c1').value = c1;
            document.getElementById('c2').value = c2;
            document.getElementById('c3').value = c3;
            document.getElementById('c4').value = c4;
        }

        // --- MOTOR DE PROCESSAMENTO ---
        function hexToRgb(hex) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return [r, g, b];
        }

        // Gera paleta interpolada (Gradient Mapping)
        function generateInterpolatedPalette(numColors) {
            const baseColors = [
                hexToRgb(document.getElementById('c1').value),
                hexToRgb(document.getElementById('c2').value),
                hexToRgb(document.getElementById('c3').value),
                hexToRgb(document.getElementById('c4').value)
            ];

            if (numColors <= 4) {
                return baseColors.slice(0, numColors);
            }

            const palette = [];
            for (let i = 0; i < numColors; i++) {
                const t = i / (numColors - 1);
                const section = t * 3; // 3 intervalos entre 4 cores
                const idx = Math.min(Math.floor(section), 2);
                const localT = section - idx;

                const cA = baseColors[idx];
                const cB = baseColors[idx + 1];

                palette.push([
                    Math.round(cA[0] + (cB[0] - cA[0]) * localT),
                    Math.round(cA[1] + (cB[1] - cA[1]) * localT),
                    Math.round(cA[2] + (cB[2] - cA[2]) * localT)
                ]);
            }
            return palette;
        }

        function applyImageAdjustments(data) {
            const exp = parseInt(document.getElementById('exposure').value);
            const bri = parseInt(document.getElementById('brightness').value);
            const sha = parseInt(document.getElementById('shadows').value);
            const sat = parseInt(document.getElementById('saturation').value) / 100;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i+1];
                let b = data[i+2];

                // Exposição
                const factor = Math.pow(2, exp / 20);
                r *= factor; g *= factor; b *= factor;

                // Brilho
                r += bri; g += bri; b += bri;

                // Sombras
                if (sha !== 0) {
                    const lum = 0.299*r + 0.587*g + 0.114*b;
                    if (lum < 128) {
                        const shadowAdj = (128 - lum) / 128 * sha;
                        r += shadowAdj; g += shadowAdj; b += shadowAdj;
                    }
                }

                // Saturação
                if (sat !== 1) {
                    const lum = 0.299*r + 0.587*g + 0.114*b;
                    r = lum + (r - lum) * sat;
                    g = lum + (g - lum) * sat;
                    b = lum + (b - lum) * sat;
                }

                data[i]   = Math.min(255, Math.max(0, r));
                data[i+1] = Math.min(255, Math.max(0, g));
                data[i+2] = Math.min(255, Math.max(0, b));
            }
        }

        // Filtro de Mediana Otimizado para preservar arestas
        function applyMedianFilter(data, width, height, passes) {
            if (passes <= 0) return;
            
            let tempData = new Uint8ClampedArray(data);
            const radius = 2; // Janela 5x5
            
            for (let p = 0; p < passes; p++) {
                const currentData = new Uint8ClampedArray(tempData);
                
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const idx = (y * width + x) * 4;
                        const rArr = [], gArr = [], bArr = [];
                        
                        for (let dy = -radius; dy <= radius; dy++) {
                            for (let dx = -radius; dx <= radius; dx++) {
                                const ny = y + dy;
                                const nx = x + dx;
                                if (ny >= 0 && ny < height && nx >= 0 && nx < width) {
                                    const nIdx = (ny * width + nx) * 4;
                                    rArr.push(currentData[nIdx]);
                                    gArr.push(currentData[nIdx+1]);
                                    bArr.push(currentData[nIdx+2]);
                                }
                            }
                        }
                        
                        rArr.sort((a,b)=>a-b);
                        gArr.sort((a,b)=>a-b);
                        bArr.sort((a,b)=>a-b);
                        const mid = Math.floor(rArr.length / 2);
                        
                        tempData[idx] = rArr[mid];
                        tempData[idx+1] = gArr[mid];
                        tempData[idx+2] = bArr[mid];
                    }
                }
            }
            
            for (let i = 0; i < data.length; i++) {
                data[i] = tempData[i];
            }
        }

        function findClosestPaletteColor(r, g, b, palette) {
            let minDist = Infinity;
            let closest = palette[0];
            for (let i = 0; i < palette.length; i++) {
                const p = palette[i];
                // Distância Euclideana rápida
                const d = (r-p[0])*(r-p[0]) + (g-p[1])*(g-p[1]) + (b-p[2])*(b-p[2]);
                if (d < minDist) {
                    minDist = d;
                    closest = p;
                }
            }
            return closest;
        }

        // Quantização usando Gradient Mapping para cores customizadas
        function mapToCustomPalette(data, palette) {
            const numColors = palette.length;
            for (let i = 0; i < data.length; i += 4) {
                // Luminância para mapear no gradiente
                const lum = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                // Normaliza de 0-255 para 0 a (numColors-1)
                let colorIdx = Math.floor((lum / 255) * numColors);
                if (colorIdx >= numColors) colorIdx = numColors - 1;
                
                const c = palette[colorIdx];
                data[i] = c[0];
                data[i+1] = c[1];
                data[i+2] = c[2];
            }
        }
        
        // Quantização preservando cores originais (Posterização Dinâmica)
        function quantizeOriginalColors(data, numColors) {
            const step = Math.floor(255 / (Math.cbrt(numColors)));
            if(step <= 0) return;
            for (let i = 0; i < data.length; i += 4) {
                data[i] = Math.round(data[i] / step) * step;
                data[i+1] = Math.round(data[i+1] / step) * step;
                data[i+2] = Math.round(data[i+2] / step) * step;
            }
        }

        function processImage() {
            if (!originalImage) return;

            const pixelSize = parseInt(document.getElementById('pixelSize').value);
            const groupSize = parseInt(document.getElementById('groupSize').value);
            const numColors = parseInt(document.getElementById('colorCount').value);
            const ditherMode = document.getElementById('ditherMode').value;

            // Escala inicial
            const scale = 1 / pixelSize;
            let w = Math.max(1, Math.floor(originalImage.width * scale));
            let h = Math.max(1, Math.floor(originalImage.height * scale));

            // Offscreen canvas para processamento
            const offCanvas = document.createElement('canvas');
            offCanvas.width = w;
            offCanvas.height = h;
            const oCtx = offCanvas.getContext('2d', { willReadFrequently: true });
            
            // Desenha a imagem reduzida
            oCtx.drawImage(originalImage, 0, 0, w, h);
            let imgData = oCtx.getImageData(0, 0, w, h);
            let data = imgData.data;

            // 1. Ajustes base (Exposição, etc)
            applyImageAdjustments(data);

            // 2. Agrupamento (Mediana - Sem Blur, Preserva Arestas)
            applyMedianFilter(data, w, h, groupSize);

            // 3. Preparar Paleta e Dithering
            const customPalette = useOriginalColors ? null : generateInterpolatedPalette(numColors);

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const idx = (y * w + x) * 4;
                    let r = data[idx];
                    let g = data[idx+1];
                    let b = data[idx+2];

                    // Aplicar Dither (Espalha erro antes de quantizar)
                    let ditherVal = 0;
                    if (ditherMode === 'bayer4') ditherVal = bayer4x4[y % 4][x % 4] * 64;
                    else if (ditherMode === 'bayer8') ditherVal = bayer8x8[y % 8][x % 8] * 64;
                    else if (ditherMode === 'h-lines') ditherVal = (y % 2 === 0 ? 0.2 : -0.2) * 64;
                    else if (ditherMode === 'v-lines') ditherVal = (x % 2 === 0 ? 0.2 : -0.2) * 64;
                    else if (ditherMode === 'noise') ditherVal = (Math.random() - 0.5) * 64;

                    r = Math.min(255, Math.max(0, r + ditherVal));
                    g = Math.min(255, Math.max(0, g + ditherVal));
                    b = Math.min(255, Math.max(0, b + ditherVal));
                    
                    data[idx] = r; data[idx+1] = g; data[idx+2] = b;
                }
            }

            // 4. Quantização Final
            if (!useOriginalColors) {
                mapToCustomPalette(data, customPalette);
            } else {
                quantizeOriginalColors(data, numColors);
            }

            oCtx.putImageData(imgData, 0, 0);

            // Desenhar de volta no canvas principal (Escala final sem suavização)
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
        }

    </script>
