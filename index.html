<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Pixelar Studio — pixel art, dither, filmes analógicos e animações em fotos e vídeos, direto no navegador.">
    <title>Pixelar Studio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23111'/%3E%3Crect x='3' y='3' width='4' height='4' fill='%23FFCC00'/%3E%3Crect x='7' y='7' width='3' height='3' fill='%23fff'/%3E%3Crect x='10' y='10' width='3' height='3' fill='%23FFCC00'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preload" href="DepartureMono-Regular.otf" as="font" type="font/otf" crossorigin>
    <link rel="stylesheet" href="css/app.css?v=2.9.2">
    <script>
        window.PIXELAR_V = '2.9.2';
        // tema antes do primeiro desenho (evita piscar)
        try { const t = localStorage.getItem('pixelar.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
</head>
<body>
    <div id="app" class="is-welcome">
        <header class="topbar">
            <button class="pill" id="btnOpen" type="button">Abrir</button>
            <div class="title" id="toolTitle"></div>
            <button class="pill primary" id="btnExport" type="button" disabled>Exportar</button>
        </header>

        <div class="subbar">
            <div class="glass-group">
                <button class="icon-btn" id="btnUndo" type="button" title="Desfazer (⌘Z)" aria-label="Desfazer" disabled></button>
                <button class="icon-btn" id="btnRedo" type="button" title="Refazer (⇧⌘Z)" aria-label="Refazer" disabled></button>
            </div>
            <div class="subbar-center" id="subbarCenter"></div>
            <div class="glass-group">
                <button class="icon-btn" id="btnCompare" type="button" title="Comparar com o original (segure a imagem ou tecla O)" aria-label="Comparar"></button>
                <button class="icon-btn dice" id="btnDice" type="button" title="Aleatório (R)" aria-label="Aleatório"></button>
                <button class="icon-btn" id="btnMore" type="button" title="Mais opções" aria-label="Mais opções"></button>
            </div>
        </div>

        <main class="stage" id="stage">
            <div class="viewport" id="viewport">
                <div class="canvas-wrap" id="canvasWrap">
                    <canvas id="outCanvas"></canvas>
                    <canvas id="origCanvas" hidden></canvas>
                    <div class="split" id="splitLine" hidden><span></span></div>
                </div>
            </div>
            <div class="param-label" id="paramLabel" aria-live="polite"></div>
            <div class="orig-badge" id="origBadge" hidden>ORIGINAL</div>

            <section class="welcome" id="welcome">
                <button class="upload-big" id="btnWelcomeOpen" type="button" aria-label="Carregar imagem ou vídeo"></button>
            </section>
            <div class="drop-hint" id="dropHint">Solte para abrir</div>
        </main>

        <div class="videobar" id="videoBar" hidden>
            <button class="icon-btn round" id="btnVideoPlay" type="button" aria-label="Tocar vídeo"></button>
            <div class="filmstrip" id="filmstrip">
                <div class="strip-frames" id="stripFrames"></div>
                <div class="trim" id="trimBox"><span class="handle l" id="trimL"></span><span class="handle r" id="trimR"></span></div>
                <div class="playhead" id="playhead"></div>
            </div>
            <button class="icon-btn round" id="btnVideoMute" type="button" aria-label="Som"></button>
        </div>

        <section class="panel" id="panel">
            <div class="seg-row" id="segRow"></div>
            <div class="dials" id="dials"></div>
            <div class="editor" id="editor"></div>
        </section>

        <nav class="tabbar" id="tabbar" aria-label="Ferramentas"></nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <input type="file" id="fileInput" accept="image/*,video/*,.avi,.mkv,.mov,.wmv,.flv,.3gp,.mts,.m2ts,.mpg,.mpeg,.vob,.divx" hidden>
    <input type="file" id="configInput" accept="image/png,text/plain,.txt" hidden>
    <input type="color" id="colorInput" class="visually-hidden" tabindex="-1" aria-hidden="true">
    <video id="sourceVideo" playsinline muted preload="auto" hidden></video>

    <script defer src="js/gpu.js?v=2.9.2"></script>
    <script defer src="js/engine.js?v=2.9.2"></script>
    <script defer src="js/anim.js?v=2.9.2"></script>
    <script defer src="js/presets.js?v=2.9.2"></script>
    <script defer src="js/media.js?v=2.9.2"></script>
    <script defer src="js/export.js?v=2.9.2"></script>
    <script defer src="js/icons.js?v=2.9.2"></script>
    <script defer src="js/sample.js?v=2.9.2"></script>
    <script defer src="js/ui.js?v=2.9.2"></script>
    <script>
        // cache offline (desligado em localhost para não atrapalhar o desenvolvimento; ?sw=1 força)
        if ('serviceWorker' in navigator && (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || /[?&]sw=1/.test(location.search))) {
            addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
            // versão nova ativada: recarrega uma única vez para usar o conjunto novo inteiro —
            // só se a página era controlada por uma versão anterior e nenhuma mídia foi aberta ainda
            const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloaded || !hadController || (window.Pixelar && window.Pixelar.media && window.Pixelar.media.el)) return;
                reloaded = true; location.reload();
            });
        }
    </script>
</body>
</html>
